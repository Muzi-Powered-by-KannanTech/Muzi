name: Build APKs for pre release
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-user-home
      ANDROID_USER_HOME: ${{ github.workspace }}/.android-user-home
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULES_TOKEN }}
          fetch-depth: 0
          submodules: recursive

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Accept SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Setup signing configs
        run: |
          echo "$KEYSTORE" | base64 --decode > test.jks
          {
            echo "storePassword=$STOREPASSWORD"
            echo "keyAlias=$KEYALIAS"
            echo "keyPassword=$KEYPASSWORD"
            echo "storeFile=test.jks"
          } > keystore.properties
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          STOREPASSWORD: ${{ secrets.STOREPASSWORD }}
          KEYALIAS: ${{ secrets.KEYALIAS }}
          KEYPASSWORD: ${{ secrets.KEYPASSWORD }}

      - name: Get date-time string
        id: datetime
        run: |
          DATE_TAG=$(date +'%Y-%m-%d_%H-%M-%S')
          echo "date_tag=$DATE_TAG" >> $GITHUB_ENV

      - name: Build core userdebug APK
        run: ./gradlew assembleCoreUserdebug --stacktrace --console=plain -DskipFormatKtlint

      - name: Resolve ffmpeg libs
        run: git clone https://github.com/mikooomich/ffmpeg-android-maker-prebuilt/ -b audio ffMetadataEx/ffmpeg-android-maker

      - name: Build full userdebug APK
        run: ./gradlew assembleFullUserdebug --stacktrace --console=plain -DskipFormatKtlint

      - name: Create github userdebug draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.date_tag }}
          name: "Build ${{ env.date_tag }}"
          draft: true
          files: |
            app/build/outputs/apk/core/userdebug/*.apk
            app/build/outputs/apk/full/userdebug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.REL_TOKEN }}
