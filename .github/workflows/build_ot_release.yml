name: Build APKs for release
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-user-home
      ANDROID_USER_HOME: ${{ github.workspace }}/.android-user-home
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULES_TOKEN }}
          fetch-depth: 0
          submodules: recursive

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Accept SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Setup signing configs
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          raw = os.environ["KEYSTORE"].strip()
          if "=" in raw and not raw.startswith("MII"):
              raw = raw.split("=", 1)[1].strip()
          raw = "".join(raw.split())
          raw += "=" * (-len(raw) % 4)
          Path("test.jks").write_bytes(base64.b64decode(raw))
          PY
          KEY_PASSWORD_VALUE="${KEYPASSWORD:-$STOREPASSWORD}"
          {
            echo "storePassword=$STOREPASSWORD"
            echo "keyAlias=$KEYALIAS"
            echo "keyPassword=$KEY_PASSWORD_VALUE"
            echo "storeFile=test.jks"
          } > keystore.properties
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          STOREPASSWORD: ${{ secrets.STOREPASSWORD }}
          KEYALIAS: ${{ secrets.KEYALIAS }}
          KEYPASSWORD: ${{ secrets.KEYPASSWORD }}

      - name: Get date-time string
        id: datetime
        run: |
          DATE_TAG=$(date +'%Y-%m-%d_%H-%M-%S')
          echo "date_tag=$DATE_TAG" >> $GITHUB_ENV
          echo "tag_name=release-${DATE_TAG}" >> $GITHUB_ENV

      - name: Build core release APK
        run: ./gradlew assembleCoreRelease lintCoreRelease testCoreDebugUnitTest --stacktrace --console=plain -DskipFormatKtlint

      - name: Resolve ffmpeg libs
        run: git clone https://github.com/mikooomich/ffmpeg-android-maker-prebuilt/ -b audio ffMetadataEx/ffmpeg-android-maker

      - name: Build full release APK
        run: ./gradlew assembleFullRelease --stacktrace --console=plain -DskipFormatKtlint

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: muzi-release-apks
          path: |
            app/build/outputs/apk/core/release/*.apk
            app/build/outputs/apk/full/release/*.apk

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag_name }}
          name: "MUZI Release ${{ env.date_tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            app/build/outputs/apk/core/release/*.apk
            app/build/outputs/apk/full/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
