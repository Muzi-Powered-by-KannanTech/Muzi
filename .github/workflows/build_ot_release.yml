name: Build APKs for release
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-user-home
      ANDROID_USER_HOME: ${{ github.workspace }}/.android-user-home
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULES_TOKEN }}
          fetch-depth: 0
          submodules: recursive

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Accept SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Setup signing configs
        run: |
          echo "$KEYSTORE" | base64 --decode > test.jks
          echo "$KEYSTORE_PROPERTIES" > keystore.properties
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}

      - name: Get date-time string
        id: datetime
        run: |
          DATE_TAG=$(date +'%Y-%m-%d_%H-%M-%S')
          echo "date_tag=$DATE_TAG" >> $GITHUB_ENV
          echo "tag_name=release-${DATE_TAG}" >> $GITHUB_ENV

      - name: Build core release APK
        run: ./gradlew assembleCoreRelease lintCoreRelease testCoreReleaseUnitTest --stacktrace --console=plain -DskipFormatKtlint

      - name: Resolve ffmpeg libs
        run: git clone https://github.com/mikooomich/ffmpeg-android-maker-prebuilt/ -b audio ffMetadataEx/ffmpeg-android-maker

      - name: Build full release APK
        run: ./gradlew assembleFullRelease --stacktrace --console=plain -DskipFormatKtlint

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: muzi-release-apks
          path: |
            app/build/outputs/apk/core/release/*.apk
            app/build/outputs/apk/full/release/*.apk

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag_name }}
          name: "MUZI Release ${{ env.date_tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            app/build/outputs/apk/core/release/*.apk
            app/build/outputs/apk/full/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
