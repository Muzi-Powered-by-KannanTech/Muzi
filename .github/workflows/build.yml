name: Build core and full release APKs
on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-user-home
      ANDROID_USER_HOME: ${{ github.workspace }}/.android-user-home
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.SUBMODULES_TOKEN }}
          fetch-depth: 0
          submodules: recursive

      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"

      - name: Accept SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Setup signing configs
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          raw = os.environ["KEYSTORE"].strip()
          if "=" in raw and not raw.startswith("MII"):
              raw = raw.split("=", 1)[1].strip()
          raw = "".join(raw.split())
          raw += "=" * (-len(raw) % 4)
          Path("test.jks").write_bytes(base64.b64decode(raw))
          PY
          KEY_PASSWORD_VALUE="${KEYPASSWORD:-$STOREPASSWORD}"
          {
            echo "storePassword=$STOREPASSWORD"
            echo "keyAlias=$KEYALIAS"
            echo "keyPassword=$KEY_PASSWORD_VALUE"
            echo "storeFile=test.jks"
          } > keystore.properties
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          STOREPASSWORD: ${{ secrets.STOREPASSWORD }}
          KEYALIAS: ${{ secrets.KEYALIAS }}
          KEYPASSWORD: ${{ secrets.KEYPASSWORD }}

      - name: Build core release APK and run checks
        run: ./gradlew assembleCoreRelease lintCoreRelease testCoreDebugUnitTest --stacktrace --console=plain -DskipFormatKtlint

      - name: Resolve ffmpeg libs
        run: git clone https://github.com/mikooomich/ffmpeg-android-maker-prebuilt/ -b audio ffMetadataEx/ffmpeg-android-maker

      - name: Build full release APK
        run: ./gradlew assembleFullRelease --stacktrace --console=plain -DskipFormatKtlint

      - name: Upload core release APK
        uses: actions/upload-artifact@v5
        with:
          name: app-core-release
          path: app/build/outputs/apk/core/release/*.apk

      - name: Upload full release APK
        uses: actions/upload-artifact@v5
        with:
          name: app-full-release
          path: app/build/outputs/apk/full/release/*.apk

      - name: Extract version name
        id: get_version
        run: |
          VERSION=$(grep "versionName =" app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Rename APKs for release
        run: |
          cp app/build/outputs/apk/core/release/*.apk muzi-core-v${{ steps.get_version.outputs.VERSION }}.apk
          cp app/build/outputs/apk/full/release/*.apk muzi-full-v${{ steps.get_version.outputs.VERSION }}.apk

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/dev'
        with:
          tag_name: "v${{ steps.get_version.outputs.VERSION }}"
          name: "🚀 MUZI Release v${{ steps.get_version.outputs.VERSION }}"
          body: |
            ## 🎧 MUZI Music Player

            🚀 Version: v${{ steps.get_version.outputs.VERSION }}

            ### ✨ Features
            - Dynamic UI with palette theming
            - BottomSheet Player (Spotify-style)
            - Highly optimized Core & Full variants

            ### 🔧 Improvements
            - Professional project-first presentation
            - Synchronized repository history
            - Automated CI/CD release pipeline

            📦 Download the APKs below and install on your device.

            ⭐ Support the project if you like it!
          draft: false
          prerelease: false
          files: |
            muzi-core-v*.apk
            muzi-full-v*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
