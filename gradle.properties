org.gradle.jvmargs=-Xmx4096M -XX:+UseParallelGC -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options="-Xmx4096M"
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true
android.newDsl=false
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true
systemProp.android.user.home=D:/Projects/MUZI/.android-user-home
android.enableR8.fullMode=true
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=false

# Flag to activate Jetpack Compose Performance HTML reports in build output
enableComposeCompilerReports=true
